# Local stand-in for the production stack: gzip, long-lived static assets, and a page cache that
# behaves like LiteSpeed's public cache (honours the app's Cache-Control / X-LiteSpeed-Cache-Control
# TTL, never caches POST, logged-in users, or responses with Set-Cookie).
user root;
worker_processes 2;
pid /tmp/claude-0/ng/nginx.pid;
error_log /tmp/claude-0/ng/logs/error.log;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/claude-0/ng/logs/access.log;
  sendfile on;
  gzip on; gzip_comp_level 6; gzip_min_length 512; gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml application/ld+json;
  fastcgi_cache_path /tmp/claude-0/ng/cache levels=1:2 keys_zone=PAGE:20m inactive=1d max_size=200m;
  map $http_cookie $logged_in { default 0; ~wordpress_logged_in_ 1; ~wp-postpass_ 1; ~comment_author_ 1; }
  map $request_method $not_get { default 1; GET 0; HEAD 0; }
  server {
    listen 127.0.0.1:8090;
    root /home/claude/wp/site;
    index index.php;
    client_max_body_size 64m;
    location ~* \.(css|js|woff2|webp|avif|jpg|jpeg|png|svg|ico)$ {
      expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass 127.0.0.1:9083;
      fastcgi_read_timeout 120;
      fastcgi_cache PAGE;
      fastcgi_cache_key "$scheme$request_method$host$request_uri";
      fastcgi_cache_bypass $logged_in $not_get $http_x_cache_bypass;
      fastcgi_no_cache $logged_in $not_get $http_x_cache_bypass;
      fastcgi_cache_valid 0;   # Nothing is cached unless the app sends a TTL.
      fastcgi_ignore_headers Expires;
      add_header X-Page-Cache $upstream_cache_status always;
    }
  }
}
